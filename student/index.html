<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Use Log & Ethics Pledge — Student Version</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=Taviraj:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1c4a40; --navy-light:#2c5f52; --navy-pale:#e5efe9;
    --gold:#b3822f; --gold-pale:#f3e7d0;
    --paper:#f6f4ee; --card:#ffffff; --border:#dcd6c8;
    --text:#232a2e; --text-soft:#5c6670;
    --green:#2f7a53; --green-bg:#e5f3ea;
    --amber:#a9741e; --amber-bg:#faf0da;
    --red:#b3403a; --red-bg:#fbe8e6;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--text); font-family:'Sarabun',sans-serif; font-size:16px; line-height:1.65; padding-bottom:80px;}
  .wrap{max-width:920px; margin:0 auto; padding:0 20px;}
  header.top{background:var(--navy); color:#fff; padding:34px 0 28px;}
  header.top h1{font-family:'Taviraj',serif; font-weight:600; font-size:1.7rem; margin:0 0 6px; line-height:1.35;}
  header.top .sub{font-size:1rem; opacity:.85; margin:0 0 4px;}
  header.top .ver{display:inline-block; margin-top:10px; font-size:.85rem; background:rgba(255,255,255,.12); padding:4px 12px; border-radius:999px;}
  .toolbar{position:sticky; top:0; z-index:50; background:#fff; border-bottom:1px solid var(--border); box-shadow:0 2px 8px rgba(0,0,0,.05);}
  .toolbar .wrap{display:flex; gap:10px; flex-wrap:wrap; align-items:center; padding:10px 20px;}
  .btn{font-family:'Sarabun',sans-serif; font-size:.92rem; font-weight:600; border:1px solid var(--navy); background:#fff; color:var(--navy); padding:8px 16px; border-radius:8px; cursor:pointer;}
  .btn:hover{background:var(--navy-pale);}
  .btn.primary{background:var(--navy); color:#fff;}
  .btn.primary:hover{background:var(--navy-light);}
  .btn.small{padding:5px 11px; font-size:.82rem;}
  .btn.danger-outline{border-color:var(--red); color:var(--red);}
  .btn.danger-outline:hover{background:var(--red-bg);}
  .lang-switch{margin-left:auto; display:flex; border:1px solid var(--navy); border-radius:999px; overflow:hidden;}
  .lang-switch button{font-family:'Sarabun',sans-serif; font-weight:700; font-size:.85rem; padding:7px 16px; border:none; background:#fff; color:var(--navy); cursor:pointer;}
  .lang-switch button.active{background:var(--navy); color:#fff;}
  section.block{margin:32px 0;}
  .section-head{display:flex; align-items:baseline; gap:12px; margin-bottom:14px; border-bottom:2px solid var(--navy); padding-bottom:8px;}
  .section-head .num{font-family:'Taviraj',serif; font-weight:600; font-size:1.5rem; color:var(--gold);}
  .section-head h2{font-size:1.2rem; margin:0; color:var(--navy);}
  .hint{color:var(--text-soft); font-size:.88rem; font-style:italic; margin:0 0 14px;}
  .note-box{background:var(--gold-pale); border:1px solid #e2cd9c; border-radius:var(--radius); padding:14px 18px; font-size:.92rem; margin:14px 0;}
  .instructions{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:18px 22px; font-size:.95rem; color:var(--text-soft);}
  .instructions ol{margin:6px 0 0; padding-left:22px;}
  details.ref{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px 20px; margin-top:16px;}
  details.ref summary{cursor:pointer; font-weight:600; color:var(--navy);}
  table.master{width:100%; border-collapse:collapse; font-size:.86rem; margin-top:12px;}
  table.master th, table.master td{border:1px solid var(--border); padding:6px 9px; text-align:left; vertical-align:top;}
  table.master th{background:var(--navy-pale); color:var(--navy);}
  .tag-scored{background:var(--green-bg);} .tag-flag{background:var(--red-bg);} .tag-none{background:#f1f0eb;}
  .field-grid{display:flex; flex-wrap:wrap; gap:14px 20px;}
  .field-grid > div{flex:1 1 260px;}
  .field-grid .full{flex:1 1 100%;}
  label.field-label{display:block; font-weight:600; font-size:.9rem; margin-bottom:4px; color:var(--navy);}
  input[type=text], input[type=date], textarea, select{width:100%; font-family:'Sarabun',sans-serif; font-size:.95rem; padding:9px 11px; border:1px solid var(--border); border-radius:8px; background:#fff; color:var(--text);}
  textarea{resize:vertical; min-height:56px;}
  input:focus, textarea:focus, select:focus{outline:2px solid var(--gold); outline-offset:1px;}
  .radio-row{display:flex; gap:22px; flex-wrap:wrap; padding:6px 0;}
  .radio-row label{font-size:.95rem; display:flex; align-items:center; gap:6px; cursor:pointer;}
  .card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:20px 22px; margin-bottom:18px; box-shadow:0 1px 4px rgba(0,0,0,.04);}
  .entry-card{border-left:5px solid var(--gold);}
  .entry-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;}
  .entry-head .title{font-weight:700; color:var(--navy); font-size:1.05rem;}
  .q-label{font-weight:600; font-size:.95rem; margin:16px 0 6px; color:var(--navy);}
  .q-hint{font-weight:400; font-style:italic; color:var(--text-soft); font-size:.82rem;}
  .opt{display:flex; align-items:flex-start; gap:8px; padding:3px 0; font-size:.92rem;}
  .opt input{margin-top:5px; flex-shrink:0;}
  .opt .code{font-weight:700; color:var(--navy); margin-right:2px;}
  .opt .note{color:var(--text-soft); font-size:.85rem;}
  .chip{display:inline-block; font-weight:700; font-size:.76rem; padding:1px 8px; border-radius:999px; margin-left:6px;}
  .chip.score{background:var(--green-bg); color:var(--green);}
  .chip.flag{background:var(--red-bg); color:var(--red);}
  .cfmp-row{display:flex; flex-wrap:wrap; gap:8px 18px;}
  .cfmp-row label{display:flex; gap:6px; align-items:flex-start; font-size:.92rem; flex:1 1 200px;}
  .cfmp-row b{color:var(--gold);}
  .entry-flags{margin-top:12px; font-size:.86rem;}
  .entry-flags div{padding:6px 10px; border-radius:8px; margin-top:6px;}
  .entry-flags .bad{background:var(--red-bg); color:var(--red);}
  .entry-flags .warn{background:var(--amber-bg); color:#7a5414;}
  .entry-flags .good{background:var(--green-bg); color:var(--green);}
  .empty-state{text-align:center; padding:30px 10px; color:var(--text-soft); font-size:.92rem; border:1.5px dashed var(--border); border-radius:var(--radius);}
  .summary-grid{display:flex; flex-wrap:wrap; gap:14px; margin-bottom:18px;}
  .stat{flex:1 1 160px; background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px; text-align:center;}
  .stat .val{font-family:'Taviraj',serif; font-size:1.7rem; font-weight:600; color:var(--navy);}
  .stat .lbl{font-size:.8rem; color:var(--text-soft); margin-top:2px;}
  .formula-box{background:var(--navy-pale); border-radius:var(--radius); padding:16px 20px; font-size:.92rem; margin:14px 0;}
  .gauge-track{position:relative; height:26px; background:#eae7dd; border-radius:999px; overflow:visible; border:1px solid var(--border); margin-top:26px;}
  .gauge-fill{height:100%; width:0%; background:var(--text-soft); border-radius:999px; transition:width .35s ease, background .35s ease;}
  .gauge-threshold{position:absolute; top:-4px; bottom:-4px; width:2px; background:var(--navy); left:40%;}
  .gauge-threshold::after{content:attr(data-label); position:absolute; top:-22px; left:50%; transform:translateX(-50%); font-size:.74rem; color:var(--navy); white-space:nowrap;}
  .result-badge{display:inline-block; margin-top:14px; padding:8px 16px; border-radius:8px; font-weight:700; font-size:.95rem;}
  .result-badge.ok{background:var(--green-bg); color:var(--green);}
  .result-badge.warn{background:var(--amber-bg); color:var(--amber);}
  .result-badge.danger{background:var(--red-bg); color:var(--red);}
  .result-badge.neutral{background:#eee; color:var(--text-soft);}
  table.phase{width:100%; border-collapse:collapse; font-size:.88rem; margin-top:8px;}
  table.phase th, table.phase td{border:1px solid var(--border); padding:6px 9px; text-align:left;}
  table.phase th{background:var(--navy-pale); color:var(--navy);}
  table.phase tr.cur td{background:var(--gold-pale); font-weight:600;}
  .cert-item{display:flex; gap:9px; padding:8px 0; font-size:.93rem; align-items:flex-start; border-bottom:1px dashed var(--border);}
  .cert-item:last-child{border-bottom:none;}
  .cert-item input{margin-top:5px; flex-shrink:0;}
  .cert-item .pali{color:var(--gold); font-weight:700;}
  .sig-row{display:flex; gap:14px; margin-bottom:16px; align-items:end; flex-wrap:wrap;}
  .sig-row > div:first-child{flex:2 1 260px;}
  .sig-row > div:last-child{flex:1 1 140px;}
  .save-note{font-size:.82rem; color:var(--text-soft);}
  footer{text-align:center; color:var(--text-soft); font-size:.82rem; padding:30px 0;}
  #printWatermark{display:none;}
  @media (max-width:640px){ .toolbar{position:static;} .field-grid > div{flex:1 1 100%;} .stat{flex:1 1 45%;} header.top h1{font-size:1.4rem;} }
  @media print{
    .toolbar, .btn, .no-print{display:none !important;}
    header.top{background:#fff !important; color:#000 !important; padding:10px 0;}
    header.top .ver{background:none; border:1px solid #000; color:#000;}
    body{background:#fff; padding-bottom:0;}
    .card{box-shadow:none; border:1px solid #999; break-inside:avoid;}
    details.ref{display:none;}
    #printWatermark{display:block; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); width:52%; max-width:460px; opacity:.09; z-index:9999; pointer-events:none;}
  }
</style>
</head>

];
const TEACHER = [['t1','I have read the entries in Part 3 and the AI use fits this task.','ได้อ่านชุดบันทึกในส่วนที่ ๓ แล้ว การใช้ AI เหมาะกับงานนี้'],
 ['t2','I spot-checked some AI answers or sources.','ได้สุ่มตรวจคำตอบหรือแหล่งอ้างอิงของ AI บางส่วนแล้ว'],
 ['t3','The thinking in this work is the student’s own.','ความคิดในงานนี้เป็นของผู้เรียนเอง']];

let lang = 'en', entries = [], seq = 0;
const KEY = 'mcu_ai_student_log_v1';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const t = k => T[lang][k] || k;
const lab = row => lang === 'en' ? row[1] : row[2];

function phaseOf(){ const w = parseInt($('pWeek').value, 10); return PHASES.find(p => w >= p.w[0] && w <= p.w[1]) || null; }

function applyText(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  $('langEN').classList.toggle('active', lang === 'en'); $('langTH').classList.toggle('active', lang === 'th');
  const wv = $('pWeek').value;
  $('pWeek').innerHTML = '<option value="">' + t('choose') + '</option>' + Array.from({length:12}, (_, i) => '<option value="' + (i + 1) + '">' + t('weekN') + (i + 1) + '</option>').join('');
  $('pWeek').value = wv;
  renderRef(); renderPledge(); renderEntries(); update();
}

function renderRef(){
  const groups = [['A', lang === 'en' ? 'What for (no points)' : 'ใช้ทำอะไร (ไม่มีคะแนน)', 'tag-none'], ['L', lang === 'en' ? 'How much (points for %)' : 'มากแค่ไหน (คะแนนคำนวณ %)', 'tag-scored'],
                  ['I', lang === 'en' ? 'What you gave AI' : 'ข้อมูลที่ป้อน', ''], ['V', lang === 'en' ? 'How you checked' : 'วิธีตรวจ', '']];
  let h = '<table class="master"><tr><th>' + (lang === 'en' ? 'Group' : 'ชุดรหัส') + '</th><th>' + (lang === 'en' ? 'Code' : 'รหัส') + '</th><th>' + (lang === 'en' ? 'Meaning' : 'ความหมาย') + '</th><th>' + (lang === 'en' ? 'Points / risk' : 'คะแนน/ความเสี่ยง') + '</th></tr>';
  groups.forEach(([g, gname, cls]) => CODES[g].forEach(r => {
    let pt = '—', c = cls;
    if (g === 'L') pt = r[3];
    if (g === 'I' || g === 'V') { pt = r[3] ? (lang === 'en' ? 'high risk' : 'เสี่ยงสูง') : (lang === 'en' ? 'OK' : 'ไม่เสี่ยง'); c = r[3] ? 'tag-flag' : 'tag-none'; }
    h += '<tr class="' + c + '"><td>' + gname + '</td><td><b>' + r[0] + '</b></td><td>' + lab(r) + '</td><td>' + pt + '</td></tr>';
  }));
  h += '</table><p class="hint" style="margin-top:8px">' + (lang === 'en' ? 'Mon language rule: if AI read or wrote Mon, choose V3 (a Mon teacher or monk checks it).' : 'กฎภาษามอญ: ถ้า AI อ่านหรือเขียนภาษามอญ ต้องเลือก V3 (ให้ครูหรือพระผู้รู้ภาษามอญตรวจ)') + '</p>';
  $('refTable').innerHTML = h;
}

function renderPledge(){
  const st = collectChecks('pl_');
  $('pledgeList').innerHTML = PLEDGE.map(p => '<label class="cert-item"><input type="checkbox" id="pl_' + p[0] + '"' + (st['pl_' + p[0]] ? ' checked' : '') + '><span>' +
    (p[1] ? '<span class="pali">' + (lang === 'en' ? p[1] : p[2]) + ': </span>' : '') + (lang === 'en' ? p[3] : p[4]) + '</span></label>').join('');
  const tt = collectChecks('tc_');
  $('teacherList').innerHTML = TEACHER.map(p => '<label class="cert-item"><input type="checkbox" id="tc_' + p[0] + '"' + (tt['tc_' + p[0]] ? ' checked' : '') + '><span>' + (lang === 'en' ? p[1] : p[2]) + '</span></label>').join('');
}
function collectChecks(prefix){ const o = {}; document.querySelectorAll('input[id^="' + prefix + '"]').forEach(i => o[i.id] = i.checked); return Object.keys(o).length ? o : (window._saved && window._saved.checks ? window._saved.checks : {}); }

function optList(name, g, cur, scored){
  return CODES[g].map(r => '<label class="opt"><input type="radio" name="' + name + '" value="' + r[0] + '"' + (cur === r[0] ? ' checked' : '') + '><span><span class="code">' + r[0] + '</span> ' + lab(r) +
    (scored ? '<span class="chip score">' + r[3] + '</span>' : '') + ((g === 'I' || g === 'V') && r[3] ? '<span class="chip flag">' + (lang === 'en' ? 'high risk' : 'เสี่ยงสูง') + '</span>' : '') + '</span></label>').join('');
}

function renderEntries(){
  const box = $('entries');
  box.innerHTML = entries.map((e, idx) => {
    const n = 'e' + e.id + '_';
    return '<div class="card entry-card" data-id="' + e.id + '">' +
      '<div class="entry-head"><span class="title">' + t('entry') + ' ' + (idx + 1) + '</span><button type="button" class="btn small danger-outline" onclick="delEntry(' + e.id + ')">' + t('del') + '</button></div>' +
      '<div class="field-grid"><div><label class="field-label">' + t('tool') + '</label><input type="text" data-f="tool" value="' + esc(e.tool) + '"></div>' +
      '<div><label class="field-label">' + t('part') + '</label><input type="text" data-f="part" value="' + esc(e.part) + '"></div></div>' +
      '<p class="q-label">' + t('qA') + '</p>' + optList(n + 'A', 'A', e.A) +
      '<p class="q-label">' + t('qL') + ' <span class="q-hint">' + t('qLh') + '</span></p>' + optList(n + 'L', 'L', e.L, true) +
      '<p class="q-label">' + t('qI') + '</p>' + optList(n + 'I', 'I', e.I) +
      '<p class="q-label">' + t('qV') + '</p>' + optList(n + 'V', 'V', e.V) +
      '<p class="q-label">' + t('qMon') + '</p><div class="radio-row"><label><input type="radio" name="' + n + 'mon" value="no"' + (e.mon === 'no' ? ' checked' : '') + '> ' + t('monNo') + '</label><label><input type="radio" name="' + n + 'mon" value="yes"' + (e.mon === 'yes' ? ' checked' : '') + '> ' + t('monYes') + '</label></div>' +
      '<p class="q-label">' + t('qPrompt') + '</p><textarea data-f="prompt">' + esc(e.prompt) + '</textarea>' +
      '<p class="q-label">' + t('qCFMP') + '</p><div class="cfmp-row">' + ['C', 'F', 'M', 'P'].map(k => '<label><input type="checkbox" data-c="' + k + '"' + (e.cfmp.indexOf(k) > -1 ? ' checked' : '') + '><span><b>' + k + '</b> ' + t(k) + '</span></label>').join('') + '</div>' +
      '<p class="q-label">' + t('qDecide') + '</p><textarea data-f="decide">' + esc(e.decide) + '</textarea>' +
      '<div class="entry-flags" id="flags' + e.id + '"></div></div>';
  }).join('');
  $('emptyState').style.display = entries.length ? 'none' : 'block';
}

function flagsFor(e, ph){
  const out = [];
  const lv = e.L ? parseInt(e.L.slice(1), 10) : 0;
  if (e.I && ['I2', 'I3', 'I4'].indexOf(e.I) > -1) out.push(['bad', t('flagI')]);
  if (e.V === 'V4') out.push(['bad', t('flagV')]);
  if (e.mon === 'yes' && e.V !== 'V3') out.push(['bad', t('flagMon')]);
  if (ph && lv > ph.max) out.push(['warn', t('flagOver')]);
  if (!e.cfmp.length) out.push(['warn', t('flagCFMP')]);
  return out;
}

function update(){
  const ph = phaseOf();
  $('pPhase').value = ph ? t(ph.k) : t('phSelect');
  const n = entries.length; let sumL = 0, over = 0, risk = 0;
  entries.forEach(e => {
    const lv = e.L ? parseInt(e.L.slice(1), 10) : 0; sumL += lv;
    const f = flagsFor(e, ph);
    if (ph && lv > ph.max) over++;
    if (f.some(x => x[0] === 'bad')) risk++;
    const box = $('flags' + e.id);
    if (box) box.innerHTML = (f.length ? f : [['good', t('flagOk')]]).map(x => '<div class="' + x[0] + '">' + x[1] + '</div>').join('');
  });
  $('stN').textContent = n; $('stL').textContent = sumL; $('stOver').textContent = over; $('stRisk').textContent = risk;
  const pct = n ? (sumL / (5 * n)) * 100 : 0;
  const thr = ph ? ph.thr : 40;
  $('formulaLine').textContent = n ? '[' + sumL + ' ÷ (5 × ' + n + ')] × 100 = ' + pct.toFixed(1) + '%' : t('noEntries');
  $('gFill').style.width = Math.min(pct, 100) + '%';
  $('gFill').style.background = !n ? 'var(--text-soft)' : (pct > thr ? 'var(--amber)' : 'var(--green)');
  $('gThr').style.left = thr + '%'; $('gThr').dataset.label = t('thrLabel') + ' ' + thr + '%';
  const rb = $('resultBadge');
  if (!n) { rb.className = 'result-badge neutral'; rb.textContent = t('noEntries'); }
  else if (risk) { rb.className = 'result-badge danger'; rb.textContent = pct.toFixed(1) + '% · ' + t('resBad'); }
  else if (pct > thr) { rb.className = 'result-badge warn'; rb.textContent = pct.toFixed(1) + '% · ' + t('resWarn'); }
  else { rb.className = 'result-badge ok'; rb.textContent = pct.toFixed(1) + '% · ' + t('resOk'); }
  $('phaseBody').innerHTML = PHASES.map(p => '<tr class="' + (p === ph ? 'cur' : '') + '"><td>' + t(p.k) + '</td><td>' + p.w[0] + '–' + p.w[1] + '</td><td>L' + p.max + ' · ' + lab(CODES.L[p.max - 1]) + '</td><td>≤ ' + p.thr + '%</td></tr>').join('');
  const used = document.querySelector('input[name=used]:checked');
  $('sec3').style.opacity = used && used.value === 'no' ? .45 : 1;
  save();
}

function readEntry(card){
  const e = entries.find(x => x.id === parseInt(card.dataset.id, 10)); if (!e) return;
  const n = 'e' + e.id + '_';
  card.querySelectorAll('[data-f]').forEach(el => e[el.dataset.f] = el.value);
  ['A', 'L', 'I', 'V', 'mon'].forEach(k => { const r = card.querySelector('input[name="' + n + k + '"]:checked'); e[k] = r ? r.value : ''; });
  e.cfmp = Array.from(card.querySelectorAll('input[data-c]:checked')).map(x => x.dataset.c);
}

window.addEntry = function(){
  entries.push({id: ++seq, tool:'', part:'', A:'', L:'', I:'', V:'', mon:'', prompt:'', decide:'', cfmp:[]});
  const yes = document.querySelector('input[name=used][value=yes]'); if (yes && !document.querySelector('input[name=used]:checked')) yes.checked = true;
  renderEntries(); update();
  const cards = document.querySelectorAll('.entry-card'); if (cards.length) cards[cards.length - 1].scrollIntoView({behavior:'smooth', block:'start'});
};
window.delEntry = function(id){ if (!confirm(t('confirmDel'))) return; entries = entries.filter(e => e.id !== id); renderEntries(); update(); };
window.setLang = function(l){ snapshotChecks(); lang = l; applyText(); };
window.clearAll = function(){
  if (!confirm(t('confirmClear'))) return;
  try { localStorage.removeItem(KEY); } catch (e) {}
  location.reload();
};
function snapshotChecks(){ const o = {}; document.querySelectorAll('input[id^="pl_"],input[id^="tc_"]').forEach(i => o[i.id] = i.checked); window._saved = window._saved || {}; window._saved.checks = o; }

const FIELDS = ['pCode', 'pWeek', 'pTask', 'pDate', 'sigStudent', 'sigStudentDate', 'teacherNote', 'sigTeacher', 'sigTeacherDate'];
function save(){
  try {
    const o = {lang: lang, entries: entries, seq: seq, f: {}, checks: {}};
    FIELDS.forEach(k => o.f[k] = $(k).value);
    const u = document.querySelector('input[name=used]:checked'); o.used = u ? u.value : '';
    document.querySelectorAll('input[id^="pl_"],input[id^="tc_"]').forEach(i => o.checks[i.id] = i.checked);
    localStorage.setItem(KEY, JSON.stringify(o));
  } catch (e) {}
}
function load(){
  let o = null;
  try { o = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { o = null; }
  if (!o) return;
  window._saved = o;
  lang = o.lang === 'th' ? 'th' : 'en';
  entries = Array.isArray(o.entries) ? o.entries : []; seq = o.seq || entries.reduce((m, e) => Math.max(m, e.id), 0);
  return o;
}

document.addEventListener('input', ev => { const card = ev.target.closest('.entry-card'); if (card) readEntry(card); update(); });
document.addEventListener('change', ev => { const card = ev.target.closest('.entry-card'); if (card) readEntry(card); update(); });

const saved = load();
applyText();
if (saved) {
  FIELDS.forEach(k => { if (saved.f && saved.f[k] != null) $(k).value = saved.f[k]; });
  if (saved.used) { const r = document.querySelector('input[name=used][value="' + saved.used + '"]'); if (r) r.checked = true; }
  update();
}
})();
</script>
</body>
</html>
